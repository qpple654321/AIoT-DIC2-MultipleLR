name: Finalize local model data

on:
  push:
    paths:
      - '.github/workflows/finalize-local-model-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch site to local model data and clean README
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'https://cdn.jsdelivr.net/gh/huanchen1107/AIoT-DIC2-MultipleLR@main/static/model_data.js',
              './static/model_data.js'
          )
          s = s.replace(
              '50 Startups 五方法統計資料採用課程 reference implementation 的公開模型結果；前端互動、版面與第二題 OLS 流程重新實作。',
              '50 Startups 的五種 Feature Selection 結果已內建於本專案，前端互動、視覺化、Boston Housing 與 Custom Dataset OLS 流程皆由本專案直接提供。'
          )
          s = s.replace('Reference model data ready.', 'Model data ready.')
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '50 Startups 五種 Feature Selection 的統計模型資料採用課程公開 reference implementation 的結果；本專案重新實作：',
              '50 Startups 的五種 Feature Selection 結果與模型資料已內建於本專案，網站包含：'
          )
          s = s.replace(
              '因此網站主要用途為整理、比較與互動呈現 Multiple Linear Regression / Feature Selection 的分析成果。',
              '網站可直接由本 repository 完成 Multiple Linear Regression / Feature Selection 的互動分析與結果呈現，不需在執行時載入課程範例的模型資料。'
          )
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/vendor-model-data.yml
          rm -f .github/workflows/finalize-local-model-data.yml

      - name: Commit finalized self-contained version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make DIC2 site self-contained with local model data"
          git push
