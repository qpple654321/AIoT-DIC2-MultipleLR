name: Vendor model data once

on:
  push:
    paths:
      - '.github/workflows/vendor-model-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch model data into this repository
        run: |
          mkdir -p static
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/huanchen1107/AIoT-DIC2-MultipleLR/main/static/model_data.js \
            -o static/model_data.js
      - name: Commit vendored model data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/model_data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Vendor feature-selection model data locally"
            git push
          fi
